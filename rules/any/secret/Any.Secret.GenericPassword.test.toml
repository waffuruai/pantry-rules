# Cases for Any.Secret.GenericPassword.yar, generated by tools/betterleaks.py and confirmed by betterleaks.
# Each text is stored reversed (`reversed_text`): read backwards, it must match exactly the
# rules in `rules` (none: it must match nothing).

[[case]]
name = "generic-password: a secret"
reversed_text = "\n,       '7\\z\\iA7\\M\\N4i\\'   =\\\"Wp-"  # gitleaks:allow
rules = ["Any_Secret_GenericPassword"]

[[case]]
name = "generic-password: the same text, the secret masked"
reversed_text = "\n,       'xxxxxxxxxxxxxx'   =\\\"Wp-"  # gitleaks:allow
rules = []
